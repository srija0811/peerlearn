apiVersion: apps/v1
kind: Deployment
metadata:
  name: peerlearn-app-deployment
  namespace: peerlearn
  labels:
    app: peerlearn-app
    app.kubernetes.io/name: peerlearn-app
    app.kubernetes.io/part-of: peerlearn-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: peerlearn-app
  template:
    metadata:
      labels:
        app: peerlearn-app
    spec:
      containers:
        - name: peerlearn-app
          image: peerlearn-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB_HOST
              value: "mysql-service"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: peerlearn-db-secret
                  key: MYSQL_DATABASE
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: peerlearn-db-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: peerlearn-db-secret
                  key: DB_PASSWORD
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 35
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
