apiVersion: v1
kind: Service
metadata:
  name: peerlearn-app-service
  namespace: peerlearn
  labels:
    app: peerlearn-app
    app.kubernetes.io/name: peerlearn-app
    app.kubernetes.io/part-of: peerlearn-platform
spec:
  type: NodePort
  selector:
    app: peerlearn-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
